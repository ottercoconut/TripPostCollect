name: macOS 隔离测试分组

on:
  workflow_dispatch:
  pull_request:
    # draft PR 不跑；标记 ready 时触发，之后的推送照常触发（#149）。
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'build_support.py'
      - 'MANIFEST.in'
      - 'db/**'
      - 'docs/formal-crawl-contract.md'
      - '.github/workflows/macos-test-lanes.yml'

permissions:
  contents: read

# 同一 PR 的新推送取消仍在运行的旧 run；手动触发不互相取消（#149）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lanes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 准备 Node 运行时
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 准备纯源码模板与独立锁定环境
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          TPC_WORK=$(mktemp -d /private/tmp/tpc-ci.XXXXXX)
          mkdir "$TPC_WORK/pristine" "$TPC_WORK/reports"
          git archive HEAD | tar -x -C "$TPC_WORK/pristine"
          echo "TPC_WORK=$TPC_WORK" >> "$GITHUB_ENV"
          cd "$TPC_WORK/pristine"
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv sync \
            --locked \
            --extra dev \
            --python "$PYTHON_VERSION"
          # OS lane 的 browser_replay 用 Playwright 管理的 Chromium headless shell，只在此联网阶段安装。
          PLAYWRIGHT_BROWSERS_PATH="$TPC_WORK/pw-browsers" \
            "$TPC_WORK/root-venv/bin/python" -m playwright install \
              --only-shell \
              chromium
          command -v node
          node --version
      - name: 核对迁移台账
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py symbols --check
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py inputs --check
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py drift
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py progress
      - name: 执行独立副本分组及选站装配
        # 正常 7–13 分钟；#105 间歇卡死时由步骤超时自动失败，不再等到 job 上限，并留出上传工件的时间（#149）。
        timeout-minutes: 15
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.TPC_WORK }}/pw-browsers
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          source "$TPC_WORK/root-venv/bin/activate"
          python scripts/ci/run_matrix.py \
            --source "$TPC_WORK/pristine" \
            --reports "$TPC_WORK/reports" \
            --runner "$GITHUB_WORKSPACE/tests/run_lanes.py"
      - name: 仅上传计数与脱敏控制证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.python }}-lane-reports
          path: |
            ${{ env.TPC_WORK }}/reports/*/result.json
            ${{ env.TPC_WORK }}/reports/*/counts.json
            ${{ env.TPC_WORK }}/reports/*/junit-summary.xml
            ${{ env.TPC_WORK }}/reports/*/network-probes.json
            ${{ env.TPC_WORK }}/reports/*/os-policy.json
            ${{ env.TPC_WORK }}/reports/*/execution-guard.json
            ${{ env.TPC_WORK }}/reports/matrix.json
            ${{ env.TPC_WORK }}/reports/coverage.json
          if-no-files-found: error
          retention-days: 7
