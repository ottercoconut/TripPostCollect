name: macOS 隔离测试分组

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'build_support.py'
      - 'MANIFEST.in'
      - 'db/**'
      - 'docs/formal-crawl-contract.md'
      # T14 过渡：fork 删除 PR 本身仍以该路径触发；T14-C 合并后删除此行。
      - 'tools/MediaCrawler'
      - '.github/workflows/macos-test-lanes.yml'

permissions:
  contents: read

jobs:
  lanes:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # fork gitlink 删除后没有子模块，此项无副作用；T14-C 合并后删除。
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 准备 Node 运行时
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 准备纯源码模板与独立锁定环境
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          TPC_WORK=$(mktemp -d /private/tmp/tpc-ci.XXXXXX)
          mkdir "$TPC_WORK/pristine" "$TPC_WORK/reports"
          git archive HEAD | tar -x -C "$TPC_WORK/pristine"
          # T14 过渡：仅 fork gitlink 仍存在时导出 fork 并建立 fork 环境；T14-C 合并后删除两段 if。
          FORK_GITLINK=0
          if [ -n "$(git ls-files -s tools/MediaCrawler)" ]; then
            FORK_GITLINK=1
            git -C tools/MediaCrawler archive HEAD | tar -x -C "$TPC_WORK/pristine/tools/MediaCrawler"
          fi
          echo "TPC_WORK=$TPC_WORK" >> "$GITHUB_ENV"
          cd "$TPC_WORK/pristine"
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv sync \
            --locked \
            --extra dev \
            --python "$PYTHON_VERSION"
          if [ "$FORK_GITLINK" = 1 ]; then
            UV_PROJECT_ENVIRONMENT="$TPC_WORK/fork-venv" uv sync \
              --locked \
              --project tools/MediaCrawler \
              --python "$PYTHON_VERSION"
          fi
          command -v node
          node --version
      - name: 核对迁移台账
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py symbols --check
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py inputs --check
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py drift
          UV_PROJECT_ENVIRONMENT="$TPC_WORK/root-venv" uv run \
            --locked \
            --no-sync \
            python scripts/dev/adapter_ledger.py progress
      - name: 执行独立副本分组及 fork 静态导入
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          source "$TPC_WORK/root-venv/bin/activate"
          # T14 过渡：fork lane 只在 gitlink 仍存在时运行；T14-C 合并后删除 FORK_ARGS。
          FORK_ARGS=()
          if [ -n "$(git ls-files -s tools/MediaCrawler)" ]; then
            FORK_ARGS=(--fork-python "$TPC_WORK/fork-venv/bin/python")
          fi
          python scripts/ci/run_matrix.py \
            --source "$TPC_WORK/pristine" \
            --reports "$TPC_WORK/reports" \
            --runner "$GITHUB_WORKSPACE/tests/run_lanes.py" \
            ${FORK_ARGS[@]+"${FORK_ARGS[@]}"}
      - name: 仅上传计数与脱敏控制证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.python }}-lane-reports
          path: |
            ${{ env.TPC_WORK }}/reports/*/result.json
            ${{ env.TPC_WORK }}/reports/*/counts.json
            ${{ env.TPC_WORK }}/reports/*/junit-summary.xml
            ${{ env.TPC_WORK }}/reports/*/network-probes.json
            ${{ env.TPC_WORK }}/reports/*/os-policy.json
            ${{ env.TPC_WORK }}/reports/*/execution-guard.json
            ${{ env.TPC_WORK }}/reports/matrix.json
            ${{ env.TPC_WORK }}/reports/coverage.json
          if-no-files-found: error
          retention-days: 7
