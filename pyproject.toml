[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trippostcollect"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "patchright>=1.60,<2",
    "pillow>=11.3,<13",
    "playwright>=1.61,<2",
    "pydantic>=2",
    "scrapling[fetchers]>=0.4.9,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/test_bilibili_image_materialization.py" = ["E402"]
"tests/test_image_persistence.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
