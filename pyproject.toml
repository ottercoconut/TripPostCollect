[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trippostcollect"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # 平台适配迁入的采集依赖：精确锁定为原 MediaCrawler worker 环境的版本，保证行为等价
    "aiofiles==23.2.1",
    "httpx==0.28.1",
    "numpy==2.3.1",
    "opencv-python==4.11.0.86",
    "parsel==1.9.1",
    "patchright>=1.60,<2",
    "pillow>=11.3,<13",
    "playwright>=1.61,<2",
    "pydantic>=2",
    "pyexecjs==1.5.1",
    "pyhumps==3.8.0",
    "scrapling[fetchers]>=0.4.9,<1",
    "tenacity==8.2.2",
    "xhshow==0.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trippostcollect.resources" = ["js/*.js", "licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "issue1_component: issue #1 的 17 个显式观测业务节点",
    "issue1_os: issue #1 的 11 个原生进程节点",
    "macos_process: 需要独立 macOS 环境的真实进程、信号或文件锁",
    "local_socket: 仅专用临时目录 AF_UNIX bind",
    "installation: 根项目完整依赖及 CLI 入口验收",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/test_bilibili_image_materialization.py" = ["E402"]
"tests/test_image_persistence.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
