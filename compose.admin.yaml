services:
  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    image: trippostcollect-admin:local
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:${TRIPPOST_ADMIN_PORT:-8787}:8787"
    environment:
      TRIPPOST_PROJECT_ROOT: "${PWD}"
      TRIPPOST_ADMIN_DB: "${PWD}/data/trippostcollect.sqlite"
      TRIPPOST_ADMIN_CONFIG: "${PWD}/config/crawl_targets.json"
      TRIPPOST_ADMIN_DB_READONLY: "true"
      TRIPPOST_ADMIN_ALLOW_COMMANDS: "false"
      TRIPPOST_ADMIN_REFRESH_SECONDS: "${TRIPPOST_ADMIN_REFRESH_SECONDS:-5}"
    volumes:
      - type: bind
        source: .
        target: "${PWD}"
        read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
